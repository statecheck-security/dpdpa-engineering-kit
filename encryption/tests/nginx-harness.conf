# Test harness: wraps tls/nginx-tls.conf in a minimal server so nginx can load and serve it.
events {}

http {
    server {
        listen 8443 ssl;
        server_name localhost;

        ssl_certificate     /etc/nginx/test-certs/cert.pem;
        ssl_certificate_key /etc/nginx/test-certs/key.pem;

        include /etc/nginx/dpdpa/nginx-tls.conf;

        location / {
            return 200 "ok\n";
        }
    }
}
