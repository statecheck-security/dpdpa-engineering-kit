# nginx TLS 1.3 configuration for DPDPA compliance
# Maps to: Rule 6(1)(a) — encryption in transit

ssl_protocols TLSv1.3 TLSv1.2;
ssl_prefer_server_ciphers on;

# TLS 1.3 cipher suites (configured via OpenSSL 1.1.1+, nginx 1.19.4+)
# TLS 1.3 defines five suites; these three are the ones OpenSSL enables by default:
#   TLS_AES_256_GCM_SHA384       (preferred)
#   TLS_CHACHA20_POLY1305_SHA256 (mobile/low-power)
#   TLS_AES_128_GCM_SHA256       (acceptable; RFC 8446 makes it mandatory to implement, so keep it)
ssl_conf_command Ciphersuites TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256:TLS_AES_128_GCM_SHA256;

# TLS 1.2 fallback — restricted to AEAD ciphers only
ssl_ciphers 'ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305';

# ECDH curve preference
ssl_ecdh_curve X25519:secp384r1;

# HSTS header — enforce TLS for 1 year
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

# OCSP stapling for certificate validation performance
ssl_stapling on;
ssl_stapling_verify on;
resolver 8.8.8.8 8.8.4.4 valid=300s;
