# Splunk correlation rule (adapt for Sentinel / QRadar / Elastic)
# Install as $SPLUNK_HOME/etc/apps/<your_app>/local/savedsearches.conf
# Tags events involving personal data assets for DPDPA triage.
#
# .conf files only allow comments on their own lines, and a multi-line value
# continues with a trailing backslash. Comments inside the search use SPL's
# triple-backtick syntax instead.

[dpdpa_breach_detection]
search = index=security sourcetype IN ("aws:cloudtrail", "azure:activity", "firewall", "dlp") \
  (action=DataExfiltration OR action=UnauthorizedAccess \
   OR action=DataModification OR action=DataDeletion \
   OR action=AccessDenied_Anomalous) \
  ``` PII asset inventory lookup: maps asset_id to personal data flag ``` \
  | lookup pii_asset_inventory.csv asset_id OUTPUT \
      contains_personal_data, data_classes, data_principal_count \
  | where contains_personal_data="true" \
  | stats count as event_count, \
          values(data_classes) as affected_classes, \
          dc(src_ip) as unique_sources, \
          min(_time) as first_seen \
    by asset_id, action \
  | where event_count > 5 \
  | eval cia_dimension=case( \
      action="DataExfiltration",       "confidentiality", \
      action="DataModification",       "integrity", \
      action="DataDeletion",           "availability", \
      action="AccessDenied_Anomalous", "availability", \
      1=1, "unknown")
dispatch.earliest_time = -15m
dispatch.latest_time = now
cron_schedule = */5 * * * *
enableSched = 1
alert_type = number of events
alert_comparator = greater than
alert_threshold = 0
# Route to SOAR for Section 2(u) classification
action.webhook = 1
action.webhook.param.url = https://soar.internal/api/v1/dpdpa-triage
